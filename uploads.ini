file_uploads = On
memory_limit = 512M
upload_max_filesize = 500M
post_max_size = 500M
max_execution_time = 600

; Never show PHP errors to visitors (they reveal server paths) - send them to the log instead,
; which ends up in `docker logs`.
display_errors = Off
display_startup_errors = Off
log_errors = On

; Don't advertise the PHP version in an X-Powered-By header
expose_php = Off
